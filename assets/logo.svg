<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="askFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5aa9e6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5aa9e6" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- clip frame -->
  <rect x="6" y="6" width="52" height="52" rx="8" fill="url(#askFill)" stroke="#5aa9e6" stroke-width="2.5"/>

  <!-- waveform bars -->
  <rect x="14" y="28" width="4" height="8"  rx="2" fill="#5aa9e6"/>
  <rect x="21" y="20" width="4" height="24" rx="2" fill="#5aa9e6"/>
  <rect x="28" y="12" width="4" height="40" rx="2" fill="#5aa9e6"/>
  <rect x="35" y="18" width="4" height="28" rx="2" fill="#5aa9e6"/>
  <rect x="42" y="24" width="4" height="16" rx="2" fill="#5aa9e6"/>

  <!-- marked region + edge handles -->
  <rect x="19" y="10" width="20" height="44" fill="none" stroke="#e15b64" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="19" cy="32" r="3" fill="#14171c" stroke="#e15b64" stroke-width="2"/>
  <circle cx="39" cy="32" r="3" fill="#14171c" stroke="#e15b64" stroke-width="2"/>
</svg>
